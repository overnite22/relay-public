[package]
name = "relay-desktop"
description = "Relay Desktop – native Windows client for Relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
relay-desktop-core = { path = "../core" }
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"
