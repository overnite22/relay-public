[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/overnite22/relay-public"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
