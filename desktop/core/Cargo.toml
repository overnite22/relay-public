[package]
name = "relay-desktop-core"
description = "Local loopback proxy and pairing logic for the Relay desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging", "rustls-platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
mime_guess = "2"
rand = "0.9"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "io-util", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
