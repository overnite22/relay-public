# Copy .env.example to .env. Local accounts are enabled by default.
services:
  init:
    image: busybox:1.37.0
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    command: ["sh", "-ec", "chown 65532:65532 /data; chmod 700 /data; chown 1000:1000 /drive; chmod 750 /drive"]
    volumes: [data:/data, drive:/drive]
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/overnite22/relay-public:latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${RELAY_PORT:-8080}:8080"]
    environment:
      RELAY_AUTH_MODE: local
      RELAY_PUBLIC_ORIGIN: ${RELAY_PUBLIC_ORIGIN:-http://localhost:8080}
      RELAY_GUACD_ADDR: guacd:4822
      RELAY_BRIDGE_HOST: relay
    volumes: [data:/data]
    depends_on:
      init: {condition: service_completed_successfully}
      guacd: {condition: service_started}
    networks: [backend]
  guacd:
    image: ${RELAY_GUACD_IMAGE:-ghcr.io/overnite22/relay-public:guacd-1.6.0}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: [drive:/drive]
    depends_on:
      init: {condition: service_completed_successfully}
    networks: [backend]
volumes:
  data: {}
  drive: {}
networks:
  backend: {}
