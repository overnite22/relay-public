name: Release image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Image version to build or promote
        required: true
        default: candidate
      promote_only:
        description: Promote an already verified version to latest without rebuilding
        type: boolean
        default: false
      rebuild_guacd:
        description: Force a fresh build of the protocol sidecar
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Verify source
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
          cd ..
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check multi-platform binaries
        env:
          IMAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --target binaries \
            --build-arg VERSION="$IMAGE_VERSION" --output type=local,dest=/tmp/relay-binaries .
          python3 scripts/check-image-architecture.py /tmp/relay-binaries
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.version || github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Determine whether guacd sources changed
        id: guacd
        env:
          FORCE_GUACD: ${{ inputs.rebuild_guacd }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ "$FORCE_GUACD" = true ] || [ -z "$previous" ] || \
             ! git diff --quiet "$previous" "$GITHUB_SHA" -- Dockerfile.guacd patches/ || \
             ! docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:guacd-1.6.0" >/dev/null 2>&1; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish maintained guacd
        if: steps.guacd.outputs.rebuild == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.guacd
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:guacd-1.6.0
          sbom: true
          provenance: mode=max
      - name: Check published image vulnerabilities
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          for image in "${IMAGE_VERSION}" guacd-1.6.0; do
          for platform in linux/amd64 linux/arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.76.2 image \
              --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
              "ghcr.io/${GITHUB_REPOSITORY}:${image}"
          done
          done
      - name: Promote verified tag to latest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_VERSION: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_VERSION}"
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote existing verified image
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_VERSION}"
