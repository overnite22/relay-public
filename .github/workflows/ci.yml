name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high && npm run build
      - name: Go
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./web)"
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build runtime image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t relay:ci .
      - name: Check runtime image vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 relay:ci
      - name: Check for exposed secrets
        run: docker run --rm -v "$PWD:/source:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /source --redact
