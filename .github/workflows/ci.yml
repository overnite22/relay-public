name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high && npm run build
      - name: Go
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./web)"
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check multi-platform binaries
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --target binaries \
            --build-arg VERSION=${GITHUB_SHA::7} --output type=local,dest=/tmp/relay-binaries .
          python3 scripts/check-image-architecture.py /tmp/relay-binaries
      - name: Build runtime image
        run: docker buildx build --platform linux/amd64 --build-arg VERSION=${GITHUB_SHA::7} --load -t relay:ci .
      - name: Check runtime image vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 relay:ci
      - name: Build guacd image
        run: docker build -f Dockerfile.guacd -t relay-guacd:ci .
      - name: Check guacd image vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 relay-guacd:ci
      - name: Check for exposed secrets
        run: docker run --rm -v "$PWD:/source:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /source --redact
